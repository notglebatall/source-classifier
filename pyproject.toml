[project]
name = "sql-agent-mvp"
version = "0.1.0"
description = "Тестовое аналитическое хранилище и MCP-сервер для SQL-агента"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "langchain>=1.1,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "mcp>=2,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "sqlglot>=27,<30",
]

[project.scripts]
sql-agent-init-db = "magician.storage.demo:main"
sql-agent-mcp = "magician.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/magician"]

[dependency-groups]
dev = [
    "ipykernel>=7,<8",
    "pytest>=8,<10",
]
